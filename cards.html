<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>بطاقات الحظ 🎁</title>
  <style>
    body {font-family: Tahoma; text-align:center; background:#f9f9f9; margin:0;}
    header {background:#4CAF50; color:white; padding:15px;}
    .cards {display:flex; justify-content:center; flex-wrap:wrap; margin-top:20px;}
    .card {
      background:white; border-radius:10px; padding:20px; margin:10px;
      width:160px; height:160px; cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:bold; text-align:center;
      transition: transform 0.3s ease;
    }
    .card:hover {background:#f0f0f0; transform:scale(1.1);}
    #result {margin-top:20px; font-size:22px; color:#333;}
    #points {margin-top:10px; font-size:20px; color:#4CAF50; font-weight:bold;}
    button {margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer;}
  </style>
</head>
<body>
  <header>
    <h1>🎡 بطاقات الحظ</h1>
  </header>

  <div class="cards" id="cards">
    <div class="card">450 جنيه كاش</div>
    <div class="card">سماعة AirPods</div>
    <div class="card">ساعة Smart</div>
    <div class="card">290 جنيه كاش</div>
    <div class="card">بطاقة خصم 50% من المتجر</div>
    <div class="card">700 جنيه كاش</div>
    <div class="card">حظ أوفر 😢</div>
    <div class="card">50 نقطة</div>
  </div>

  <button onclick="play()">جرب حظك</button>
  <div id="result"></div>
  <div id="points">رصيدك: 0 نقطة</div>

  <script>
    let firstTry = true; // علشان نعرف أول محاولة
    let userPoints = 0;  // عداد النقاط

    function play() {
      const prizes = [
        "450 جنيه كاش 💵",
        "سماعة AirPods 🎧",
        "ساعة Smart ⌚",
        "290 جنيه كاش 💵",
        "بطاقة خصم 50% من قسم المتجر 🛍️",
        "700 جنيه كاش 💵",
        "حظ أوفر 😢",
        "50 نقطة ⭐"
      ];

      let random;

      if (firstTry) {
        // أول مرة: 80% احتمال يطلع "حظ أوفر"
        const chance = Math.random();
        if (chance < 0.8) {
          random = 6; // حظ أوفر
        } else {
          random = Math.floor(Math.random() * prizes.length);
        }
        firstTry = false;
      } else {
        random = Math.floor(Math.random() * prizes.length);
      }

      const resultText = prizes[random];
      document.getElementById("result").innerText = "مبروك! جائزتك: " + resultText;

      // لو النتيجة "حظ أوفر" يظهر تنبيه
      if (random === 6) {
        alert("😢 للأسف حظ أوفر! جرب مرة تانية 🚀");
      }

      // لو النتيجة نقاط، أضفها للرصيد
      if (random === 7) {
        userPoints += 50;
        document.getElementById("points").innerText = "رصيدك: " + userPoints + " نقطة";
      }
    }
  </script>
</body>
</html>
