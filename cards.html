<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>بطاقات الحظ 🎁</title>
  <style>
    body {font-family: Tahoma; text-align:center; background:#f9f9f9;}
    header {background:#4CAF50; color:white; padding:15px;}
    .cards {display:flex; justify-content:center; flex-wrap:wrap; margin-top:20px;}
    .card {
      background:white; border-radius:10px; padding:20px; margin:10px;
      width:160px; height:160px; cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:bold; text-align:center;
      position:relative;
    }
    .highlight {
      border:3px solid red;
      box-shadow:0 0 15px red;
    }
    #result {margin-top:20px; font-size:22px; color:#333;}
    button {margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer;}
  </style>
</head>
<body>
  <header>
    <h1>🎡 بطاقات الحظ</h1>
  </header>

  <div class="cards" id="cards">
    <div class="card">450 جنيه كاش</div>
    <div class="card">سماعة AirPods</div>
    <div class="card">ساعة Smart</div>
    <div class="card">290 جنيه كاش</div>
    <div class="card">بطاقة خصم 50% من المتجر</div>
    <div class="card">700 جنيه كاش</div>
    <div class="card">حظ أوفر</div>
    <div class="card">50 نقطة</div>
  </div>

  <button onclick="play()">جرب حظك</button>
  <div id="result"></div>

  <script>
    let firstTry = true;

    function play() {
      const cards = document.querySelectorAll(".card");
      let prizes = [
        "450 جنيه كاش 💵",
        "سماعة AirPods 🎧",
        "ساعة Smart ⌚",
        "290 جنيه كاش 💵",
        "بطاقة خصم 50% من قسم المتجر 🛍️",
        "700 جنيه كاش 💵",
        "حظ أوفر",
        "50 نقطة ⭐"
      ];

      let finalIndex;
      if (firstTry) {
        const chance = Math.random();
        if (chance < 0.8) {
          finalIndex = 6; // حظ أوفر
        } else {
          finalIndex = Math.floor(Math.random() * prizes.length);
        }
        firstTry = false;
      } else {
        finalIndex = Math.floor(Math.random() * prizes.length);
      }

      // إزالة أي هايلايت قديم
      cards.forEach(c => c.classList.remove("highlight"));

      let current = 0;
      let interval = setInterval(() => {
        cards.forEach(c => c.classList.remove("highlight"));
        cards[current].classList.add("highlight");
        current = (current + 1) % cards.length;
      }, 200); // سرعة اللفة (200ms لكل بطاقة)

      // مدة اللفة 12 ثانية
      setTimeout(() => {
        clearInterval(interval);
        cards.forEach(c => c.classList.remove("highlight"));
        cards[finalIndex].classList.add("highlight");
        document.getElementById("result").innerText = "مبروك! جائزتك: " + prizes[finalIndex];
      }, 12000); // 12 ثانية
    }
  </script>
</body>
</html>
