<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول المستودع</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #ffca28; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #ffb300; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>تسجيل دخول المستودع</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="loginUser()">دخول</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAwgDjNeIgy_Uul10D0AMZaj9R5w649I_4",
          authDomain: "inventory-system-781a3.firebaseapp.com",
          projectId: "inventory-system-781a3",
          storageBucket: "inventory-system-781a3.firebasestorage.app",
          messagingSenderId: "696099097946",
          appId: "1:696099097946:web:1f65607223b836c4e83763",
          measurementId: "G-01RWEDDL4G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loginUser = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, password)
              .then((userCredential) => {
                  // تحويل المستخدم لصفحة مركز المكافآت بعد النجاح
                  window.location.href = "rewards.html";
              })
              .catch((error) => {
                  alert("خطأ في تسجيل الدخول: " + error.message);
              });
        }
    </script>
</body>
</html>
