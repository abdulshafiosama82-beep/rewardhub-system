<!DOCTYPE html>
<html lang="ar">
<head>

  <style>
    body {font-family: Tahoma; text-align:center; background:#f9f9f9;}
    h1 {margin-top:20px; color:#4CAF50;}

    .card {
      background:white; border-radius:10px; padding:20px; margin:10px;

      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:bold; text-align:center;
      transition:0.3s;
    }
    .card:hover {background:#f0f0f0; transform:scale(1.05);}
  </style>
</head>
<body>
  <h1>🎁 مركز المكافآت</h1>
  <p>اختر القسم اللي تحب تدخله:</p>

  <div class="cards">
    <div class="card" onclick="location.href='cards.html'">بطاقات الحظ 🎡</div>
    <div class="card" onclick="location.href='rewards.html'">الجوائز 🎁</div>
    <div class="card" onclick="location.href='community.html'">المجتمع 👥</div>
    <div class="card" onclick="location.href='tools.html'">الأدوات 🛠️</div>
    <div class="card" onclick="location.href='tournaments.html'">البطولات 🏆</div>
    <div class="card" onclick="location.href='ads.html'">الإعلانات 💼</div>
  </div>
</body>
</html>
