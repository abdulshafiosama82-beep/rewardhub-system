<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع CASH</title>
    <!-- استيراد خط كايو الأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #fcfcfc;
            --btn-color: #c9a678; /* لون الأزرار البيضاوية حسب تصميمك */
            --btn-hover: #b89364;
            --text-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:  Cairo , sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* الشريط الجانبي (الأزرار البيضاوية) */
        .sidebar {
            width: 270px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 30px 15px;
            border-left: 1px solid #eeeeee;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .nav-btn {
            background-color: var(--btn-color);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            padding: 12px 20px;
            border-radius: 50px; /* تصميم بيضاوي تماماً مثل رسمتك */
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.04);
        }

        .nav-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }

        /* منطقة المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 50px;
        }

        .welcome-title {
            font-size: 1.85rem;
            font-weight: 700;
            line-height: 1.9;
            max-width: 800px;
        }

        .welcome-title .cash {
            font-weight: 900;
            color: #000;
            background-color: #f1f5f9;
            padding: 0 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* التوافق مع الشاشات الصغيرة (الموبايل) */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 15px;
            }
            .nav-btn {
                flex: 1 1 40%;
                font-size: 0.95rem;
                padding: 10px;
            }
            .main-content {
                padding: 25px;
            }
            .welcome-title {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي المطابق لتصميمك -->
    <aside class="sidebar">
        <a href="#" class="nav-btn">الصفحة الرئيسية</a>
        <a href="#" class="nav-btn">بطاقات الحظ</a>
        <a href="#" class="nav-btn">البطولات</a>
        <a href="#" class="nav-btn">المهام</a>
        <a href="#" class="nav-btn">المجتمع</a>
        <a href="#" class="nav-btn">التصفح</a>
    </aside>

    <!-- محتوى الصفحة -->
    <main class="main-content">
        <h1 class="welcome-title">
            اهلا بيكم في موقع <span class="cash">CASH</span> لربح الجوائز والتحديات المليئة بالارباح الشهريه.
        </h1>
    </main>

</body>
</html>
